version: "3.8"

services:
  # ==========================================
  # BACKEND API (FastAPI)
  # ==========================================
  astrowake_backend:
    image: aryalvesfernandes/landingpage-astrowake:backend-1.0.3
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TZ=America/Sao_Paulo
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.astrowake-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
        - traefik.http.routers.astrowake-api.entrypoints=websecure
        - traefik.http.routers.astrowake-api.tls=true
        - traefik.http.routers.astrowake-api.tls.certresolver=letsencryptresolver
        - traefik.http.services.astrowake-api.loadbalancer.server.port=8000

  # ==========================================
  # FRONTEND (Nginx - Landing Page & Leads)
  # ==========================================
  astrowake_frontend:
    image: aryalvesfernandes/landingpage-astrowake:frontend-1.0.3
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.astrowake-frontend.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.astrowake-frontend.entrypoints=websecure
        - traefik.http.routers.astrowake-frontend.tls=true
        - traefik.http.routers.astrowake-frontend.tls.certresolver=letsencryptresolver
        - traefik.http.services.astrowake-frontend.loadbalancer.server.port=80

# ==========================================
# REDES
# ==========================================
networks:
  network_swarm_public:
    name: network_swarm_public
    external: true