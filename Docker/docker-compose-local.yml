name: astrowake-landing-page

services:
  astrowake-postgres:
    image: postgres:16-alpine
    container_name: astrowake-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: astrowake_db
      POSTGRES_USER: astrowake_user
      POSTGRES_PASSWORD: astrowake_pass
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrowake_user -d astrowake_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  astrowake-backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.backend
    container_name: astrowake-backend-local
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://astrowake_user:astrowake_pass@astrowake-postgres:5432/astrowake_db
    ports:
      - "8001:8000"
    depends_on:
      astrowake-postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app

  astrowake-frontend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: astrowake-frontend-local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - astrowake-backend

volumes:
  postgres_data:
